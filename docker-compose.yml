services:
  elasticsearch:
    labels:
      com.example.service: "es"
      com.example.description: "For searching and indexing data"
    # security disabled: demo-only, keep the dashboard flow passwordless
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.9
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    networks:
      - elk
    volumes:
      - type: volume
        source: esdata
        target: /usr/share/elasticsearch/data/
    ports:
      - "9200:9200"
    healthcheck:
      # gates logstash (and nginx, whose syslog target must resolve) so a
      # cold start cannot race logstash's Elasticsearch bootstrap
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/ >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  logstash:
    labels:
      com.example.service: "logstash"
      com.example.description: "For logging data"
    image: docker.elastic.co/logstash/logstash:8.17.9
    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx256m
    networks:
      - elk
    volumes:
      - ./samples/logstash:/etc/logstash
    # ecs_compatibility=disabled: the sample conf predates ECS field naming
    command: logstash -f /etc/logstash/logstash.conf --pipeline.ecs_compatibility disabled
    depends_on:
      elasticsearch:
        condition: service_healthy
      es-template-init:
        condition: service_completed_successfully

  # one-shot: install the accounting index template via the legacy
  # _template API; must complete before logstash starts indexing
  es-template-init:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.9
    depends_on:
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./samples/logstash/es_template_accounting.json:/es_template_accounting.json:ro
    entrypoint: ["curl", "-fsS", "-X", "PUT", "http://elasticsearch:9200/_template/ngx_accounting", "-H", "Content-Type: application/json", "-d", "@/es_template_accounting.json"]
    restart: "no"
    networks:
      - elk

  kibana:
    labels:
      com.example.service: "kibana"
      com.example.description: "Data visualisation and for log aggregation"
    image: docker.elastic.co/kibana/kibana:8.17.9
    networks:
      - elk
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  grafana:
    labels:
      com.example.service: "grafana"
      com.example.description: "Data visualisation"
    image: grafana/grafana:13.3.1
    networks:
      - elk
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./samples/grafana:/etc/grafana/provisioning
    depends_on:
      - elasticsearch

  nginx:
    container_name: nginx_accounting
    build:
      context: .
      dockerfile: samples/Dockerfile
      # Restricted-network environments: put container-reachable proxy
      # addresses in a local .env (see .env.example).  Empty values are
      # treated as "no proxy" by curl, so plain environments are unaffected.
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        ALL_PROXY: ${ALL_PROXY:-}
        NO_PROXY: ${NO_PROXY:-localhost,127.0.0.0/8,*.local}
    networks:
      - nginx
      - elk
    ports:
      - 8080:8080
      - 8888:8888
      - 9999:9999
    depends_on:
      - logstash


networks:
  nginx:
  elk:

volumes:
  esdata:
