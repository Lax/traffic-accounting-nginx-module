# Not a workflow of this repository -- kept here, outside .github/workflows,
# so that nothing runs it.  It is the instrument behind "What keeps
# automation off master" in COMPATIBILITY.md: it measures whether a workflow
# token holding `contents: write` can write to a branch that carries the
# same protection rules as `master`.
#
# Last run (valid): https://github.com/Lax/traffic-accounting-nginx-module/actions/runs/45533274170
#   PROBE_CONTROL_UNPROTECTED=ACCEPTED      control: the token can push
#   PROBE_A_PUSH_PROTECTED=REJECTED         GH006: Changes must be made through a pull request
#   PROBE_B_PR_CREATE=ACCEPTED              the token can open a PR onto the protected branch
#   PROBE_B_MERGE_PROTECTED=REJECTED        At least 1 approving review is required
#   PROBE_C_PUSH_WORKFLOW_FILE=REJECTED     needs the `workflows` permission
#
# To repeat the measurement (all objects below are throw-away; `master` is
# not touched).  These are the steps as they were actually carried out:
#
#   R=repos/<owner>/<repo>
#   base=$(git ls-remote origin refs/heads/master | cut -f1)
#   for b in probe-base-tmp protect-probe-tmp probe-unprotected-tmp; do
#       git push origin "$base:refs/heads/$b"; done
#
#   # Mirror master's protection rule onto the throw-away branch only.  The
#   # request body is written by hand because a GET of master's rule has the
#   # nested form ({"enabled": false, "url": ...}) and the PUT wants scalars.
#   # Copy the values from `gh api $R/branches/master/protection`:
#   gh api -X PUT $R/branches/protect-probe-tmp/protection --input - <<'JSON'
#   {
#     "required_status_checks": {"strict": true, "contexts": []},
#     "enforce_admins": false,
#     "required_pull_request_reviews": {"dismiss_stale_reviews": false,
#                                       "require_code_owner_reviews": true,
#                                       "required_approving_review_count": 1},
#     "restrictions": null,
#     "required_linear_history": false,
#     "allow_force_pushes": false,
#     "allow_deletions": false,
#     "block_creations": false,
#     "required_conversation_resolution": false
#   }
#   JSON
#
#   # Put this file at .github/workflows/workflow-token-probe.yml in one
#   # commit on top of master, push that commit as branch probe-head-tmp, and
#   # open the PR that triggers the probe:
#   gh pr create --base probe-base-tmp --head probe-head-tmp --title "protection probe"
#
#   # Read the PROBE_ lines from the run of the "workflow-token-probe"
#   # workflow.  Read the control first: if it was not ACCEPTED the run
#   # proves nothing (see the note on the first attempt below).
#
#   # Clean up, and check that the branch list and master's protection rule
#   # are what they were before:
#   gh pr close <the probe PR>
#   gh pr close <the PR test B opened, if it did>
#   gh api -X DELETE $R/branches/protect-probe-tmp/protection
#   git push origin --delete probe-base-tmp probe-head-tmp protect-probe-tmp probe-unprotected-tmp
#
# The first attempt (run 45533032603) was invalid and is kept as a lesson:
# it pushed the checked-out merge commit of the PR, which a depth=1 checkout
# cannot prove to be a fast-forward, so even the control push was rejected
# for a reason that had nothing to do with protection.  A control that fails
# voids the experiment.
name: workflow-token-probe
on:
  pull_request:
    branches: [probe-base-tmp]
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          git config user.name "protection-probe"
          git config user.email "protection-probe@users.noreply.github.com"
          echo "PROBE_TOKEN_IDENTITY=$(gh api graphql -f query='{viewer{login}}' --jq .data.viewer.login 2>/dev/null)"

          # a new empty commit directly on top of <branch>'s remote tip
          on_tip() {
            git fetch -q origin "$1" --depth=1
            local tip; tip=$(git rev-parse FETCH_HEAD)
            git commit-tree "$tip^{tree}" -p "$tip" -m "probe: empty commit"
          }
          try_push() {   # label, commit, branch
            git push origin "$2:refs/heads/$3" > "push-$1.log" 2>&1; local rc=$?
            echo "exit status of 'git push -> $3': $rc"
            grep -vE "^(To | \* \[new|$)" "push-$1.log" | head -8
            [ $rc -eq 0 ] && echo "PROBE_$1=ACCEPTED" || echo "PROBE_$1=REJECTED"
          }

          echo "=== control: push to an UNPROTECTED branch ==="
          try_push CONTROL_UNPROTECTED "$(on_tip probe-unprotected-tmp)" probe-unprotected-tmp

          echo "=== test A: push to a PROTECTED branch (same rules as master) ==="
          try_push A_PUSH_PROTECTED "$(on_tip protect-probe-tmp)" protect-probe-tmp

          echo "=== test B: bot opens a PR onto the protected branch, then merges it WITHOUT admin ==="
          url=$(gh pr create --base protect-probe-tmp --head probe-unprotected-tmp \
                  --title "probe: bot-opened PR onto a protected branch" \
                  --body "Temporary; created by the protection probe. Not to be merged by anyone." 2> prc.log)
          rc3=$?; grep -v '^$' prc.log | tail -3
          if [ $rc3 -ne 0 ]; then
            echo "PROBE_B_PR_CREATE=FAILED"
          else
            echo "PROBE_B_PR_CREATE=ACCEPTED (PR ${url##*/})"
            gh pr merge "${url##*/}" --merge > merge.log 2>&1; rc4=$?
            echo "exit status of 'gh pr merge --merge' (no admin): $rc4"
            grep -v '^$' merge.log | tail -6
            [ $rc4 -eq 0 ] && echo "PROBE_B_MERGE_PROTECTED=ACCEPTED" || echo "PROBE_B_MERGE_PROTECTED=REJECTED"
          fi

          echo "=== test C: can the token push a commit that ADDS a workflow file (unprotected branch)? ==="
          git fetch -q origin probe-base-tmp --depth=1
          tip=$(git rev-parse FETCH_HEAD)
          export GIT_INDEX_FILE="$RUNNER_TEMP/probe-index"
          git read-tree "$tip^{tree}"
          blob=$(printf 'name: probe-c\non: [workflow_dispatch]\npermissions:\n  contents: read\njobs: {}\n' | git hash-object -w --stdin)
          git update-index --add --cacheinfo "100644,$blob,.github/workflows/probe-c.yml"
          tree=$(git write-tree); unset GIT_INDEX_FILE
          try_push C_PUSH_WORKFLOW_FILE "$(git commit-tree "$tree" -p "$tip" -m "probe: adds a workflow file")" probe-base-tmp
