input {
    syslog {
        port => 29124
    }
}
filter {
    # Two kinds of lines share the accounting log: metric lines, which carry
    # an accounting_id, and the module's lifecycle lines.
    grok {
        pattern_definitions => {
            "TIMESTAMP_NGX" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{HOUR}:?%{MINUTE}(?::?%{SECOND})"
        }
        match => {
          "message" =>
          "%{TIMESTAMP_NGX} \[%{LOGLEVEL}] %{NUMBER}\#%{NUMBER}: pid:%{NUMBER:pid:int}\|from:(?<from>\d{10})\|to:(?<to>\d{10})\|accounting_id:(?<accounting_id>[^|]+)\|%{WORD:entry_type}:%{NUMBER:nr_entries:int}\|bytes_in:%{NUMBER:in_bytes:int}\|bytes_out:%{NUMBER:out_bytes:int}\|latency_ms:%{NUMBER:latency_ms:int}\|upstream_latency_ms:%{NUMBER:upstream_latency_ms:int}\|%{GREEDYDATA:statuses}"
        }
        remove_field => [ "host", "severity", "facility", "priority", "severity_label", "facility_label" ]
        remove_tag => []
    }
    # Not a metric: recognise the lifecycle lines the module writes, as an
    # exact list.  A match clears the metric parse-failure tag (remove_tag
    # only runs on a match), so whatever stays tagged "_grokparsefailure"
    # is genuinely unparsable -- including a metric line whose format
    # drifted, or a line kind this filter does not know yet.
    if ![accounting_id] {
      grok {
        pattern_definitions => {
            "TIMESTAMP_NGX" => "%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{HOUR}:?%{MINUTE}(?::?%{SECOND})"
        }
        match => {
          "message" =>
          "%{TIMESTAMP_NGX} \[%{LOGLEVEL}] %{NUMBER}\#%{NUMBER}: pid:%{NUMBER:pid:int}\|(?<ngx_event>(?:start|stop) (?:http|stream) traffic accounting|accounting period rotation failed)$"
        }
        remove_field => [ "host", "severity", "facility", "priority", "severity_label", "facility_label" ]
        remove_tag => [ "_grokparsefailure" ]
      }
    }
    # Only metric lines are metrics: their periods and statuses get parsed,
    # and they are the only events indexed (the index mapping assumes every
    # document is a metric).  Lifecycle and alert lines, and anything that
    # failed to parse, stay on stdout for diagnosis.
    if [accounting_id] {
    # date {
    #   match => [ "timestamp" , "yyyy/MM/dd HH:mm:ss" ]
    #   target => '@timestamp'
    #   # timezone => 'Asia/Shanghai'
    #   remove_field => [ "timestamp" ]
    # }
    date {
      match => [ "from" , "UNIX" ]
      target => '@from'
      remove_field => [ "from" ]
    }
    date {
      match => [ "to" , "UNIX" ]
      target => '@to'
      remove_field => [ "to" ]
    }
    kv {
        source => "statuses"
        target => "statuses_kv"
        field_split => "|"
        value_split => ":"
        remove_field => [ "statuses" ]
    }
    ruby {
        code => "s={};agg={};agg.default=0;(event.get('statuses_kv')||{}).each{|k,v|agg['%dxx'%k[0]]+=v.to_i;s[k]=v.to_i};event.set('@agg_status',agg);event.set('@nr_status',s)"
        remove_field => [ "statuses_kv" ]
    }
    }
}
output {
  stdout { codec => rubydebug }
  if [accounting_id] {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    # Template installation is done by the es-template-init compose service
    # via the legacy _template API (which still accepts this legacy-format
    # template).  logstash 8's ES output posts legacy-format templates to
    # the composable _index_template endpoint instead, where ES rejects
    # them ("unknown field [settings]") and the pipeline shuts down.
    manage_template => false
    index => "ngx_accounting-%{+xxxx.ww}"
  }
  }
}
