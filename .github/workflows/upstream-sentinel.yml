name: upstream-sentinel

# Watch nginx.org for new releases and keep the tested version window
# (see COMPATIBILITY.md) in step with upstream:
#
#   unchanged        -> summary only
#   changed, green   -> PR that applies the window to
#                       .github/nginx-versions.json and to the demo image
#                       tag in samples/Dockerfile, and triggers the full
#                       tests matrix on its branch (at most one such PR is
#                       open at a time)
#   changed, red     -> issue with the failing logs, baseline untouched
#                       (the next daily run re-detects and re-reports)
#
# The sentinel never merges anything: a human reviews the window PR.
#
# A PR opened with the workflow token does not get its pull_request-triggered
# workflows run by itself: that run parks in "action_required" until a human
# approves it, and nothing on the PR says so.  The sentinel therefore
# dispatches the tests matrix on the PR branch (workflow_dispatch is the one
# trigger the token may fire) and links it from the PR body.  Merge only on
# a green linked run.
#
# Daily, not weekly: a scan costs seconds, and the policy in
# COMPATIBILITY.md promises a green window within a few working days of an
# upstream release.  nginx 1.30.8/1.31.10 (a CVE fix) were released on
# 2026-11-23, hours after that day's weekly scan, and would otherwise have
# gone unnoticed for a week.

on:
  schedule:
    # Off the hour: GitHub's scheduler is busiest at the top of every hour
    # and on-the-hour schedules here ran roughly 8-10.5h late
    # (observed 2026-11-22..24).
    - cron: "23 7 * * *"   # daily, 07:23 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write          # dispatch the tests matrix on the window PR branch

concurrency:
  group: upstream-sentinel
  cancel-in-progress: false

jobs:
  scan:
    name: scan nginx.org
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.verdict.outputs.changed }}
      versions: ${{ steps.verdict.outputs.versions }}
      summary: ${{ steps.verdict.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - name: parser selftest
        run: python3 .github/scripts/scan-upstream.py selftest
      - name: scan maintained lines
        run: |
          python3 .github/scripts/scan-upstream.py scan \
              > "$RUNNER_TEMP/discovered.json"
          cat "$RUNNER_TEMP/discovered.json"
      - name: diff against baseline window
        run: |
          python3 .github/scripts/scan-upstream.py diff \
              .github/nginx-versions.json "$RUNNER_TEMP/discovered.json" \
              > "$RUNNER_TEMP/verdict.json"
          cat "$RUNNER_TEMP/verdict.json"
      - id: verdict
        name: extract verdict
        run: |
          python3 - <<'EOF'
          import json, os
          v = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "verdict.json")))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("changed=%s\n" % ("true" if v["changed"] else "false"))
              f.write("versions=%s\n" % " ".join(v["changed_versions"]))
              f.write("summary<<SUMMARY_EOF\n%s\nSUMMARY_EOF\n" % v["summary"])
          EOF
      - name: job summary
        if: always()
        run: |
          {
            echo "## nginx window scan"
            echo ""
            if [[ -f "$RUNNER_TEMP/discovered.json" ]]; then
              echo "- discovered: $(python3 -c 'import json;d=json.load(open("'$RUNNER_TEMP'/discovered.json"));print("stable=%s mainline=%s previous_stable=%s" % (d["stable"], d["mainline"], d["previous_stable"]))')"
            else
              echo "- discovered: (scan failed, see the failing step above)"
            fi
            echo "- verdict: ${SUMMARY:-n/a}"
            echo "- baseline: $(python3 -c 'import json;d=json.load(open(".github/nginx-versions.json"));print("stable=%s mainline=%s previous_stable=%s floor=%s" % (d["stable"], d["mainline"], d["previous_stable"], d["floor"]))')"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          SUMMARY: ${{ steps.verdict.outputs.summary }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-scan
          path: |
            ${{ runner.temp }}/discovered.json
            ${{ runner.temp }}/verdict.json
          retention-days: 14

  validate:
    name: validate changed versions
    needs: scan
    if: needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      all_green: ${{ steps.validate.outputs.all_green }}
    steps:
      - uses: actions/checkout@v4
      - id: validate
        name: build + functional suite per changed version
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          rc_all=0
          for v in ${{ needs.scan.outputs.versions }}; do
            echo "=== validating nginx $v ==="
            if ! tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
                    -o "$RUNNER_TEMP/build-$v" -v both \
                    --nginx-version "$v" --werror -j"$(nproc)" \
                    > "$RUNNER_TEMP/logs/build-$v.log" 2>&1; then
              echo "$v" >> "$RUNNER_TEMP/failed.txt"
              rc_all=1
              continue
            fi
            if ! tests/run-tests.sh "$RUNNER_TEMP/build-$v/nginx" both \
                    > "$RUNNER_TEMP/logs/test-$v.log" 2>&1; then
              echo "$v" >> "$RUNNER_TEMP/failed.txt"
              rc_all=1
            fi
          done
          if [[ $rc_all -eq 0 ]]; then
            echo "all_green=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_green=false" >> "$GITHUB_OUTPUT"
            for v in $(cat "$RUNNER_TEMP/failed.txt"); do
              echo "### nginx $v" >> "$RUNNER_TEMP/logs/brief.md"
              echo '```' >> "$RUNNER_TEMP/logs/brief.md"
              tail -30 "$RUNNER_TEMP/logs/build-$v.log" >> "$RUNNER_TEMP/logs/brief.md" 2>/dev/null || true
              tail -30 "$RUNNER_TEMP/logs/test-$v.log" >> "$RUNNER_TEMP/logs/brief.md" 2>/dev/null || true
              echo '```' >> "$RUNNER_TEMP/logs/brief.md"
            done
          fi
      - name: fail the validate job on red versions
        # make validation failures visible here too, not only via the
        # report job's issue; the report job runs regardless (always()).
        run: |
          if [[ "${{ steps.validate.outputs.all_green }}" != "true" ]]; then
            echo "validation failed for: $(cat "$RUNNER_TEMP/failed.txt" 2>/dev/null || echo '<unknown>')" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sentinel-logs
          path: ${{ runner.temp }}/logs
          retention-days: 14

  report:
    name: report verdict
    needs: [scan, validate]
    if: always() && needs.scan.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-scan
          path: scan-artifacts
      - uses: actions/download-artifact@v4
        if: needs.validate.outputs.all_green != 'true'
        with:
          name: sentinel-logs
          path: logs
        continue-on-error: true   # artifact absent when validate died early

      - name: apply validated window
        if: needs.validate.outputs.all_green == 'true'
        run: |
          python3 - <<'EOF'
          import json, re, sys
          v = json.load(open("scan-artifacts/verdict.json"))
          if not v["changed"]:
              # unreachable with per-run artifacts, kept as a tripwire
              sys.exit("verdict.json no longer reports a change; aborting")
          if not re.match(r"^\d+\.\d+\.\d+$", v["proposed"]["stable"]):
              sys.exit("refusing to apply a non x.y.z stable: %r" % v["proposed"]["stable"])
          with open(".github/nginx-versions.json", "w") as f:
              json.dump(v["proposed"], f, indent=2)
              f.write("\n")
          # The demo image runs the window stable; move it in the same
          # commit so the PR is self-consistent (the version-window CI job
          # rejects the two disagreeing).
          path = "samples/Dockerfile"
          src = open(path).read()
          arg_line = r"(?m)^ARG NGX_TAG=\S+[ \t]*$"
          hits = len(re.findall(arg_line, src))
          if hits != 1:
              sys.exit("%s: expected exactly one 'ARG NGX_TAG=' line, found %d" % (path, hits))
          out = re.sub(arg_line, "ARG NGX_TAG=%s-alpine" % v["proposed"]["stable"], src)
          open(path, "w").write(out)
          print("window applied:", v["summary"], "| demo tag ->", v["proposed"]["stable"] + "-alpine")
          EOF
          git diff --stat

      - name: open window PR
        if: needs.validate.outputs.all_green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUMMARY="${{ needs.scan.outputs.summary }}"
          STABLE="$(python3 -c 'import json; print(json.load(open(".github/nginx-versions.json"))["stable"])')"
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # One open window PR at a time.  A daily scan re-detects the same
          # upstream change on every run until that PR is merged; re-report
          # there instead of stacking another PR on top of it.
          existing=$(gh pr list --state open --limit 100 \
              --json number,headRefName \
              --jq '[.[] | select(.headRefName | startswith("nginx-window-"))][0].number // ""')
          if [[ -n "$existing" ]]; then
            gh pr comment "$existing" --body \
                "Re-validated by upstream-sentinel ([run $GITHUB_RUN_ID]($RUN_URL)): $SUMMARY. This PR is still the pending window update."
            echo "window PR #$existing is already open; commented there instead of opening another"
            exit 0
          fi
          BR="nginx-window-$(date +%Y%m%d)-$GITHUB_RUN_ID"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BR"
          git add .github/nginx-versions.json samples/Dockerfile
          git commit -m "nginx window update: $SUMMARY"
          git push origin "$BR"
          {
            echo "## nginx window update"
            echo ""
            echo "$SUMMARY"
            echo ""
            echo "Applies to \`.github/nginx-versions.json\` and to the demo image tag in \`samples/Dockerfile\` (\`ARG NGX_TAG=$STABLE-alpine\`)."
            echo ""
            echo "Validated by upstream-sentinel (build + functional suite, \`both\` variant):"
            echo ""
            for v in ${{ needs.scan.outputs.versions }}; do
              echo "- nginx $v"
            done
            echo ""
            echo "**Full test matrix on this branch:**"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/tests.yml?query=branch%3A$BR"
            echo ""
            echo "It is triggered explicitly by the sentinel: workflows triggered by this PR itself wait for a manual approval (\`action_required\`) because the PR is opened with the workflow token."
            echo ""
            echo "Review checklist:"
            echo "- the linked matrix run is green"
            echo "- the official \`nginx:$STABLE-alpine\` image exists: https://hub.docker.com/_/nginx/tags?name=$STABLE-alpine"
            echo ""
            echo "Then merge; nothing else needs editing."
          } > pr-body.md
          gh pr create \
              --title "nginx window update: $SUMMARY" \
              --body-file pr-body.md \
              --base master --head "$BR"
          gh workflow run tests.yml --ref "$BR"
          echo "tests matrix dispatched on $BR"

      - name: open issue on validation failure
        if: needs.validate.outputs.all_green != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="nginx window update failed validation"
          BODY=issue-body.md
          {
            echo "## nginx window update failed validation"
            echo ""
            echo "nginx.org now advertises: ${{ needs.scan.outputs.summary }}"
            echo ""
            echo "The baseline was **not** changed; the next daily run will"
            echo "re-detect and re-report until adapted or the baseline is"
            echo "updated by hand (floor is always manual, see COMPATIBILITY.md)."
            echo ""
            echo "Changed versions validated: ${{ needs.scan.outputs.versions }}"
            echo ""
            echo "Full per-version build/test logs: workflow artifact \`sentinel-logs\`."
          } > "$BODY"
          # attach the failing logs' tails when validate produced a brief
          if [[ -f logs/brief.md ]]; then
            echo "### failing logs (tails)" >> "$BODY"
            cat logs/brief.md >> "$BODY"
          fi
          existing=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number' || true)
          if [[ -n "${existing:-}" ]]; then
            gh issue comment "$existing" --body-file "$BODY"
            echo "updated existing issue #$existing"
          else
            gh issue create --title "$TITLE" --body-file "$BODY"
          fi
