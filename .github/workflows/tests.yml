name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    # What keeps automation off `master` is the arrangement of permissions
    # and scripts in the workflow files themselves (see "What keeps
    # automation off master" in COMPATIBILITY.md).  Check it on every run,
    # so that changing it is a reviewed diff instead of a quiet edit.  The
    # self-test runs first: a rule that cannot catch a planted violation
    # is not a rule.
    name: workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: each policy rule catches a planted violation (self-test)
        run: python3 .github/scripts/check_workflow_policy.py --selftest
      - name: policy
        run: python3 .github/scripts/check_workflow_policy.py

  window:
    # The tested nginx version set comes from .github/nginx-versions.json
    # (see COMPATIBILITY.md).  The upstream-sentinel workflow updates that
    # file; this job turns it into the matrix, so a window bump needs no
    # workflow edit.
    name: version window
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      stable: ${{ steps.gen.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        run: python3 .github/scripts/gen-matrix.py --github-output

  matrix:
    name: ${{ matrix.variant }} / nginx ${{ matrix.nginx }}
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.window.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v "${{ matrix.variant }}" \
              --nginx-version "${{ matrix.nginx }}" --werror -j"$(nproc)"
      - name: functional suite
        run: tests/run-tests.sh "$RUNNER_TEMP/build/nginx" "${{ matrix.variant }}"

  clang:
    # gcc and clang disagree on some diagnostics; keep one clang run per
    # window so module code stays warning-clean under both.
    name: clang / nginx ${{ needs.window.outputs.stable }}
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v both --cc clang \
              --nginx-version "${{ needs.window.outputs.stable }}" \
              --werror -j"$(nproc)"
      - name: functional suite
        run: tests/run-tests.sh "$RUNNER_TEMP/build/nginx" both

  compat:
    # --with-compat widens the dynamic-module signature; downstream builds
    # that load third-party modules compiled by other parties rely on it.
    name: --with-compat / nginx ${{ needs.window.outputs.stable }}
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v both --with-compat \
              --nginx-version "${{ needs.window.outputs.stable }}" \
              --werror -j"$(nproc)"
      - name: functional suite
        run: tests/run-tests.sh "$RUNNER_TEMP/build/nginx" both

  dynamic:
    # The --add-dynamic-module build ships one .so registering both the HTTP
    # and STREAM modules (see README); the static suite cannot catch a
    # load-time regression, so smoke it: load, account, reload.
    name: dynamic module smoke / nginx ${{ needs.window.outputs.stable }}
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v both --dynamic \
              --nginx-version "${{ needs.window.outputs.stable }}" \
              -j"$(nproc)"
      - name: smoke
        run: tests/dynamic-smoke.sh "$RUNNER_TEMP/build"

  asan:
    name: asan soak
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v both --asan --werror -j"$(nproc)" \
              --nginx-version "${{ needs.window.outputs.stable }}"
      - name: functional suite
        run: |
          # nginx -t under ASAN exits non-zero when LeakSanitizer reports the
          # master's intentionally-unfreed cycle pools (nginx-core-inherent;
          # proven identical on a stock no-module build).  Keep ASAN memory-
          # error detection fully enabled, drop only the exit-time LSan noise.
          ASAN_OPTIONS=detect_leaks=0 \
              tests/run-tests.sh "$RUNNER_TEMP/build/nginx" both
      - name: soak
        run: tests/load/run-soak.sh "$RUNNER_TEMP/build/nginx" --total 30000 --rotations 6

  load:
    name: load conservation
    needs: window
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          tests/lib/build-nginx.sh -s "$GITHUB_WORKSPACE" \
              -o "$RUNNER_TEMP/build" -v both --werror -j"$(nproc)" \
              --nginx-version "${{ needs.window.outputs.stable }}"
      - name: conservation
        run: |
          tests/load/run-conservation.sh "$RUNNER_TEMP/build/nginx" \
              --total 50000 --interval 5
