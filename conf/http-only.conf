load_module modules/ngx_http_accounting_module.so;
worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
    access_log off;
    accounting on;
    accounting_interval 99999;
    accounting_id '$host';
    accounting_log /dev/stdout;
    server {
        listen 8080;
        location / { return 200 'ok\n'; accounting_id '/'; }
    }
}
